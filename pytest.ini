[pytest]
testpaths = tests
# scripts/ uses flat imports (`import detect`, `import storage`), so it goes
# on the path rather than being treated as a package.
pythonpath = scripts
# NumPy 2.5 deprecated its "generic" timedelta unit and says it will become
# an error. Python hides DeprecationWarnings raised outside __main__, so the
# nightly job could emit this for weeks unseen (it did: detect.py, found
# 2026-10-06). Promoting just this one to an error makes any return of it a
# red test before the digest, instead of a silent future outage.
filterwarnings =
    error:The 'generic' unit for NumPy timedelta:DeprecationWarning
