# Flight Deal Scanner — sweep configuration
#
# This file is data, not secrets: no token lives here. See PLAN.md for the
# reasoning behind each choice below.

api:
  base_url: "https://api.travelpayouts.com"
  # Auth via header, never query param (PLAN.md §2) — a token in a query
  # string ends up in every logged URL, permanently, in this public repo.
  token_env_var: "TRAVELPAYOUTS_TOKEN"
  token_header: "X-Access-Token"

  # Settled in step 1 by calling both live, not from docs (PLAN.md §2).
  # /aviasales/v3/grouped_prices looked like the "everywhere" endpoint but
  # isn't — it collapses to one fare per date across all destinations
  # combined (85 of ~372 possible destinations ever appeared). prices_cheap
  # is the real everywhere endpoint: 372 destinations in one call. Kept as
  # a single confirmed endpoint rather than a candidate list now that the
  # comparison is done.
  endpoint:
    name: prices_cheap
    path: "/v1/prices/cheap"
    params:
      destination: "-"
    month_param: depart_date

market:
  currency: "GBP"
  market: "uk"
  locale: "en"

# Explicit airports, not the LON metro code (PLAN.md §3, revised in step 1) —
# the live response never reports which airport a fare used, even when the
# metro code is queried, so airport granularity only exists if it's put in
# the request. Never blended into one baseline: STN budget fares and LHR
# long-haul are bimodal and would wreck Phase 2 percentile scoring.
origins:
  - LHR
  - LGW
  - STN
  - LTN
  - LCY
  - MAN
  - BHX
  - EDI
  - GLA
  - BRS

destinations:
  # destination=- ; curation can't discover the deal you weren't already
  # looking for (PLAN.md §3). city-directions marks a priority subset for
  # later use — it does not filter what gets swept.
  mode: all
  core_subset_source: "/v1/city-directions"

horizon:
  # Rolling from today, not a fixed calendar window (PLAN.md §3).
  # Split matches the call budget in PLAN.md §2: 7 near months swept
  # nightly, 12 far months swept weekly (19 months total — the brief's
  # "~18 months" plus rounding from that split; flagged, not hidden).
  near_months: 7
  far_months: 12
  # Which day the far-months tier runs, in addition to the nightly near
  # sweep. Not specified anywhere upstream — this is the concrete choice
  # made in step 3. Python's date.weekday(): 0=Monday ... 6=Sunday.
  far_sweep_weekday: 6  # Sunday

# Round-trip only for Phase 1 (PLAN.md §3, revised in step 1) — one_way is
# silently ignored by prices_cheap, confirmed live. One-way at full-universe
# scale would need a per-route endpoint, reintroducing the call-volume
# problem the endpoint choice in §2 exists to avoid.
trip_types:
  - round_trip

rate_limit:
  # Throttled below the documented 60/min ceiling (PLAN.md §2) for jitter
  # and retry headroom.
  requests_per_minute: 50
  # Retries on 429/5xx/network errors before an origin-month call is given
  # up on as a hard failure. Retry-After is honoured when the API sends
  # one; this is the fallback count and exponential-backoff cap otherwise.
  max_retries: 3

retention:
  raw_days: 120
  # Never mean-only — the cheap end of the distribution is the whole point
  # and can't be reconstructed after raw rows are gone (PLAN.md §4).
  rollup_stats: [min, p05, p25, p50, count]

detection:
  # A flight isn't scored until it's been observed on at least this many
  # distinct nights — guards against flagging noise from 1-2 data points
  # (PLAN.md §7's plan for Phase 2, now built as scripts/detect.py).
  min_observations: 5
  # Flag only when tonight's price is a genuine new low AND at least this
  # fraction below its own recent median. Either condition alone is too
  # weak on its own — see PLAN.md's Phase 2 section for why both are
  # required together. 0.15 -> 0.20 on 2026-09-10 (140 -> ~80 flags/week);
  # 0.20 -> 0.25 on 2026-09-17 (47/43 unique -> 31/29 unique); 0.25 -> 0.30
  # same day, request direct rather than a volume complaint this time —
  # real 7-day window at the time: 16 flags / 16 unique at 30% (all
  # already-unique; nothing left to collapse at this bar). Also checked
  # and recorded then: 11/11 at 35%, in case 30% still isn't the number.
  # notify.py's digest builder filters to this same bar at render time
  # (not the stored data/flags/*.jsonl files), so the change takes effect
  # on the existing record immediately, not just on new flags.
  drop_pct_threshold: 0.30
  # min_trip_nights (a generic 2-night floor with a Sat-Sun exception)
  # retired 2026-09-19: replaced by two hyper-specialized products
  # instead of one general-shape rule — see detect.PRODUCTS
  # (is_weekend_trip / is_during_holiday). Shared here rather than
  # per-product for now (both read drop_pct_threshold/min_observations
  # above); revisit only once real volume from both suggests they need
  # different bars.
  #
  # Added 2026-09-25, directly requested after a real Holiday Deals
  # alert went out 82 days ahead of departure: skip flagging anything
  # departing more than this many days from tonight. Neither product
  # actually decided on a lead-time cap when built — trip *shape* was
  # the whole focus then (PLAN.md's 2026-09-19 pivot), and how far in
  # the future a deal could be was simply left unbounded, not
  # deliberately left open. Shared by both products for the same reason
  # drop_pct_threshold/min_observations are: no evidence yet that they
  # need different bars. The far-months sweep tier (horizon.far_months
  # above) still fetches and stores months 8-19 out regardless — this
  # only stops *alerting* on that far-future data, not collecting it;
  # it's still needed for the eventual seasonal-comparison detector
  # (PLAN.md §7's year-one note) once enough history exists.
  max_lead_days: 21

monitoring:
  # If the newest heartbeat is older than this when a run starts, print a
  # loud warning (PATTERNS.md §4.4's fix, applied from day one). 36h gives
  # slack beyond the ~24h nightly cadence before treating lateness as a
  # problem worth flagging on every subsequent run.
  staleness_warning_hours: 36

booking_links:
  # Not secrets — trs is a Travelpayouts Project ID, marker is a Partner
  # ID, both read straight off the dashboard (marker even shows up in
  # Travelpayouts' own public widget snippets elsewhere on the web),
  # unlike TRAVELPAYOUTS_TOKEN. Same "plain config, not env" treatment as
  # notify.smtp_username/from_address above. Project "Flight Alerts" (ID
  # 575278), channel type Website, traffic-source URL
  # https://flightalert.rohit-nair.com — the domain this project already
  # sends email from, the truthful thing to declare (TODO.md).
  trs: 575278
  marker: 771104
  create_link_path: "/links/v1/create"
  # Per-link tracking tag in Travelpayouts' own reporting — distinguishes
  # these clicks from any other future use of the same account (TODO.md's
  # "book a real trip" reminder), at zero cost.
  sub_id: "digest"
  # Short branded links (aviasales.tp.st/...) rather than long ones with
  # every tracking param spelled out — cleaner in an email table that
  # already has to fit a 375px phone width (PLAN.md's HTML digest work).
  shorten: true
  # Documented as 100 requests/minute *per marker* (Travelpayouts' "API
  # for Travelpayouts partner links" doc) — a different, much higher
  # ceiling than rate_limit.requests_per_minute above, which throttles the
  # unrelated price-sweep endpoint. Kept as its own key rather than reused,
  # since the two limits belong to different endpoints.
  requests_per_minute: 100

notify:
  # Nightly, not weekly (2026-09-19 — digest_weekday retired). The old
  # weekly cadence ("weekly signal, not real-time alert") was designed
  # around a generic route-is-cheap-for-the-season alert; a weekend-trip
  # deal is inherently short-lead-time, and batching it for up to six
  # days before sending ate directly into the window that's the whole
  # premise of that product. This doesn't change the underlying data's
  # staleness (still a 2-7-day-old cache, same as always) — it just stops
  # adding avoidable delivery lag on top of that. notify.py now runs
  # every night and sends only when either product has something new;
  # see its module docstring.
  # Resend (transactional email, free tier) — switched from the
  # Gmail/Yahoo consumer-webmail search on 2026-09-17. Those providers
  # anti-abuse-gate *account creation* (Gmail rate-limited new accounts)
  # or *app-password issuance* (Yahoo's "does this look established"
  # fraud heuristic — no published timeframe, stuck two+ weeks). Both
  # gate humans signing up for a mailbox, not automated senders. Resend
  # is built for the latter: no aging wait, just a one-time domain
  # verification. Full comparison in PLAN.md's delivery section, the
  # remaining setup checklist in TODO.md.
  smtp_host: "smtp.resend.com"
  smtp_port: 587
  # Resend's SMTP username is always this literal string — it names the
  # *protocol account*, not the sender. Not a secret. Confirmed against
  # Resend's own SMTP docs, not assumed.
  smtp_username: "resend"
  # Must be an address on a domain verified in the Resend dashboard.
  # Not a secret either — it's the visible sender on every email sent —
  # so unlike the old Gmail-era sender it can live here in plain config.
  # Domain verified 2026-09-17 (see PLAN.md); local part chosen to match
  # the "London Flight Deals" brand below, same day.
  from_address: "londondeals@flightalert.rohit-nair.com"
  # The display name recipients see in their inbox ("London Flight Deals
  # <londondeals@...>"), not just the bare address. Also not a secret —
  # it's the visible sender name on every email. Domain-level
  # verification (DKIM/SPF on flightalert.rohit-nair.com) authorizes
  # sending from any local part at that domain, so changing this and
  # from_address together needed no new DNS work — confirmed by the next
  # real test send, not just assumed.
  from_name: "London Flight Deals"
  # Not secrets themselves — the *names* of env vars holding secrets,
  # read via os.environ.get, matching every other credential in this
  # project (PATTERNS.md §2's pattern). The actual API key and recipient
  # list never belong in this committed, public file.
  password_env_var: "SMTP_PASSWORD"
  recipients_env_var: "NOTIFY_RECIPIENTS"
